<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RedirHub</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img class="logo" src="../icons/icon-32.png" alt="">
    <div class="brand"><strong>RedirHub</strong><span>Redirect Path &amp; 404s</span></div>
    <button class="account" id="account" type="button"></button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-chain" aria-selected="true">Redirects</button>
    <button role="tab" id="tab-404" aria-selected="false">404s <span class="count" id="nf-count" hidden></span></button>
    <button role="tab" id="tab-domains" aria-selected="false">Domains</button>
  </nav>

  <main>
    <section id="view-chain"></section>
    <section id="view-404" hidden></section>
    <section id="view-domains" hidden></section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
