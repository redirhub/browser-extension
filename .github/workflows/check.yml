name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Manifest is valid JSON with a version
        run: node -e "const m=require('./manifest.json'); if(!/^\d+\.\d+\.\d+$/.test(m.version)) process.exit(1)"
